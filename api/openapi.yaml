openapi: 3.1.0

info:
  title: MCPDoll Control Plane API
  version: 0.1.0
  summary: The single contract behind MCPDoll's API, CLI, and console.
  description: |
    This document is the source of truth for every MCPDoll operation. The Go
    server interfaces, the Go client the CLI uses, the TypeScript client the
    console uses, and `docs/api/` are all generated from it.

    Two rules make that more than a slogan:

    - **The CLI is an API client and never touches the database.** Anything the
      CLI can do, an external integrator can do, because the CLI has no
      privileged path.
    - **Every operation declares its surfaces** in `x-mcpdoll-surfaces`, and
      `make parity` fails the build if an operation lacks a CLI command or a UI
      route, or if a CLI or UI binding names an operation that does not exist.

    See `docs/adr/0004-api-first-tri-surface.md`.

    ## What this version covers

    The registry is a reviewable YAML document rather than database rows, and
    the control plane's durable side is not built (see `docs/deferred.md`). So
    the operations here are the ones that are genuinely implemented: reading the
    registry, inspecting and verifying snapshots, and observing a live data
    plane. Registry *mutation* through the API arrives with the database.

  license:
    name: MIT

servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: registry
    description: The declarative registry document
  - name: snapshots
    description: Signed serving configuration
  - name: gateway
    description: A live data plane
  - name: plugins
    description: Pipeline plugins and their rollout state
  - name: system
    description: Health and metadata

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness
      tags: [system]
      x-mcpdoll-surfaces:
        cli: mcpdoll system health
        ui: /system/health
      responses:
        "200":
          description: The control plane is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/hooks:
    get:
      operationId: listHooks
      summary: List the seven pipeline hooks
      description: |
        The set is closed. Adding an eighth requires an ADR, so this list is a
        contract rather than a convenience.
      tags: [plugins]
      x-mcpdoll-surfaces:
        cli: mcpdoll registry hooks
        ui: /plugins/hooks
      responses:
        "200":
          description: The hooks, in execution order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HookList" }

  /api/v1/registry:
    get:
      operationId: getRegistry
      summary: Read the resolved registry document
      tags: [registry]
      x-mcpdoll-surfaces:
        cli: mcpdoll registry show
        ui: /registry
      responses:
        "200":
          description: The registry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registry" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/registry:validate:
    post:
      operationId: validateRegistry
      summary: Validate a registry document without contacting any backend
      description: |
        Structure and internal consistency only: unknown keys, dangling
        references, duplicate prefixes, TTLs that try to widen rather than
        narrow. Offline, so it belongs in a pull-request check.
      tags: [registry]
      x-mcpdoll-surfaces:
        cli: mcpdoll registry validate
        ui: /registry/validate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateRegistryRequest" }
      responses:
        "200":
          description: The document is valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrySummary" }
        "422":
          description: The document is invalid, with every problem listed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/registry/servers:
    get:
      operationId: listServers
      summary: List the registered backends
      tags: [registry]
      x-mcpdoll-surfaces:
        cli: mcpdoll registry servers
        ui: /registry/servers
      responses:
        "200":
          description: The backends
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerList" }

  /api/v1/registry/servers/{serverId}:
    get:
      operationId: getServer
      summary: Read one backend
      tags: [registry]
      x-mcpdoll-surfaces:
        cli: mcpdoll registry servers show
        ui: /registry/servers/:serverId
      parameters:
        - $ref: "#/components/parameters/ServerId"
      responses:
        "200":
          description: The backend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/snapshots/current:
    get:
      operationId: getCurrentSnapshot
      summary: Read the snapshot the gateway is serving
      tags: [snapshots]
      x-mcpdoll-surfaces:
        cli: mcpdoll snapshot current
        ui: /snapshots
      responses:
        "200":
          description: The snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/snapshots:inspect:
    post:
      operationId: inspectSnapshot
      summary: Show what a snapshot file contains
      description: |
        Reads a snapshot *without* verifying it, so one signed by a key you do
        not hold can still be inspected — which is exactly when inspection is
        most useful. Use `verifySnapshot` to check the signature.
      tags: [snapshots]
      x-mcpdoll-surfaces:
        cli: mcpdoll snapshot inspect
        ui: /snapshots/inspect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InspectSnapshotRequest" }
      responses:
        "200":
          description: The snapshot's contents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/snapshots:build:
    post:
      operationId: buildSnapshot
      summary: Resolve the registry into a signed snapshot
      description: |
        Discovers every backend the registry names, canonicalizes what they
        publish, and signs the result. Every problem is a build failure: a
        snapshot some data-plane instances would refuse is worse than none.
      tags: [snapshots]
      x-mcpdoll-surfaces:
        cli: mcpdoll snapshot build
        ui: /snapshots/build
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildSnapshotRequest" }
      responses:
        "200":
          description: The build report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildReport" }
        "422":
          description: The snapshot could not be built
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/snapshots:verify:
    post:
      operationId: verifySnapshot
      summary: Check a snapshot's signature and that it would activate
      description: |
        Both halves matter. A correctly signed snapshot with a dangling
        reference is refused by every data-plane instance.
      tags: [snapshots]
      x-mcpdoll-surfaces:
        cli: mcpdoll snapshot verify
        ui: /snapshots/verify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifySnapshotRequest" }
      responses:
        "200":
          description: The verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyReport" }
        "422":
          description: The snapshot failed verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/keys:generate:
    post:
      operationId: generateSigningKey
      summary: Mint an Ed25519 snapshot signing keypair
      description: |
        For local development. The private key is written unencrypted; whoever
        holds it can publish configuration to every data-plane instance, so
        production keys must come from your key management system.
      tags: [snapshots]
      x-mcpdoll-surfaces:
        cli: mcpdoll keys generate
        ui: /snapshots/keys
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateSigningKeyRequest" }
      responses:
        "200":
          description: The generated key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }

  /api/v1/plugins:
    get:
      operationId: listPlugins
      summary: List the pipeline plugins and their rollout state
      tags: [plugins]
      x-mcpdoll-surfaces:
        cli: mcpdoll plugins list
        ui: /plugins
      responses:
        "200":
          description: The plugins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginList" }

  /api/v1/gateway/status:
    get:
      operationId: getGatewayStatus
      summary: Report which snapshot a data plane is serving
      tags: [gateway]
      x-mcpdoll-surfaces:
        cli: mcpdoll gateway status
        ui: /gateway
      responses:
        "200":
          description: The gateway's status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayStatus" }
        "503":
          description: The gateway is not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayStatus" }

  /api/v1/gateway/backends:
    get:
      operationId: listBackends
      summary: What the gateway's prober knows about each backend
      description: |
        Every backend's condition, and how far each has drifted from what was
        admitted. Drift is the interesting column: the gateway serves admitted
        definitions and never live backend output, which makes a backend
        changing its catalog a detectable event rather than a silent change to
        what clients see — but only because something looks.

        `blocked_tools` is what a strict backend's drift actually costs. In
        advisory mode it is always zero however far the backend has moved.
      tags: [gateway]
      x-mcpdoll-surfaces:
        cli: mcpdoll gateway backends
        ui: /gateway/backends
      responses:
        "200":
          description: Backend conditions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendHealthReport" }
        "502": { $ref: "#/components/responses/Unavailable" }

  /api/v1/gateway/tenants:
    get:
      operationId: listTenants
      summary: List the tenants a data plane serves
      tags: [gateway]
      x-mcpdoll-surfaces:
        cli: mcpdoll gateway tenants
        ui: /gateway/tenants
      responses:
        "200":
          description: The tenants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantList" }

  /api/v1/gateway/catalog:
    get:
      operationId: getCatalog
      summary: List the tools an identity actually sees
      description: |
        Connects to the data plane as a real MCP client, as the given identity,
        and returns the catalog it receives — including `ttlMs` and
        `cacheScope`.

        This is the answer to "which tools can this agent call?" that cannot be
        wrong, because it is the same request the agent makes.
      tags: [gateway]
      x-mcpdoll-surfaces:
        cli: mcpdoll gateway catalog
        ui: /gateway/catalog
      parameters:
        - name: subject
          in: query
          description: Principal subject to present
          schema: { type: string }
        - name: groups
          in: query
          description: Comma-separated IdP groups to present
          schema: { type: string }
      responses:
        "200":
          description: The catalog that identity receives
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gateway/tools/{toolName}:call:
    post:
      operationId: callTool
      summary: Call a tool through the gateway as a chosen identity
      description: |
        Invokes the tool as a real MCP client would, so what you see is what an
        agent would see — including a policy denial or a grace-window
        unavailability, both of which arrive as tool errors rather than
        transport failures.
      tags: [gateway]
      x-mcpdoll-surfaces:
        cli: mcpdoll gateway call
        ui: /gateway/playground
      parameters:
        - name: toolName
          in: path
          required: true
          description: The qualified tool name
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallToolRequest" }
      responses:
        "200":
          description: The tool result, including a tool-level error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallResult" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      description: The backend's registry id
      schema: { type: string }

  responses:
    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Unavailable:
      description: |
        The data plane could not be reached. Distinct from a 403, which means
        it answered and refused — reporting an authorization decision as an
        outage sends the reader to the wrong system.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # Every schema here is checked against the Go struct that produces it, by
    # internal/api/schema_test.go. A field renamed on one side and not the other
    # fails the build rather than reaching a client as `undefined`.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable token. Clients switch on this; the message
            is for humans and may be reworded.
          enum:
            - invalid_request
            - not_found
            - forbidden
            - validation_failed
            - upstream_unavailable
            - internal_error
        message:
          type: string
          description: One sentence, written for whoever has to fix the problem.
        problems:
          type: array
          items: { type: string }
          description: |
            Every distinct failure. Validation returns all of them at once: a
            document with six errors should take one round trip to fix.

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string }
        version: { type: string }
        registry_path:
          type: string
          description: |
            The document this control plane is serving. Unexpected output is
            nearly always the wrong file rather than the wrong logic.
        snapshot_path: { type: string }

    HookList:
      type: object
      required: [hooks]
      properties:
        hooks:
          type: array
          items: { type: string }
          description: The seven hooks, in execution order. The set is closed.

    Registry:
      type: object
      description: |
        A registry document with defaults resolved. Not the on-disk YAML: an
        unset `serving_mode` reads as `strict` here because that is what the
        engine will do, and rule bodies are summarised to counts.
      required: [org, version, namespaces, servers, toolsets]
      properties:
        org: { type: string }
        version: { type: integer, format: int64 }
        namespaces:
          type: array
          items: { $ref: "#/components/schemas/Namespace" }
        servers:
          type: array
          items: { $ref: "#/components/schemas/Server" }
        toolsets:
          type: array
          items: { $ref: "#/components/schemas/Toolset" }
        policies:
          type: array
          items: { $ref: "#/components/schemas/Policy" }
        plugins:
          type: array
          items: { $ref: "#/components/schemas/Plugin" }

    Namespace:
      type: object
      required: [id, name, prefix]
      properties:
        id: { type: string }
        name: { type: string }
        prefix:
          type: string
          description: |
            What every tool in this namespace is served under, and why two
            namespaces cannot share one.
        owner_idp_group: { type: string }
        team: { type: string }
        project: { type: string }

    Server:
      type: object
      required: [id, name, namespace, bindings, serving_mode, default_effect_class]
      properties:
        id: { type: string }
        name: { type: string }
        namespace: { type: string }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/Binding" }
        serving_mode:
          type: string
          enum: [strict, advisory]
          description: |
            Resolved, never empty. `strict` refuses to serve a definition that
            has drifted from what was admitted; `advisory` serves it and
            records the drift.
        criticality: { type: string }
        data_classification: { type: string }
        compliance_scope:
          type: array
          items: { type: string }
        default_effect_class:
          type: string
          enum: [read, write, destructive]
        canary_tool:
          type: string
          description: |
            Probed to decide whether this backend is healthy, rather than
            trusting a transport-level ping.
        tool_overrides:
          type: object
          additionalProperties: { type: string }
          description: |
            Tools whose effect class the registry states explicitly. Everything
            else inherits `default_effect_class`.
        excluded_tools:
          type: array
          items: { type: string }
          description: |
            Withheld from every toolset. Kept separate from `tool_overrides`
            because an exclusion is not an override with a blank class — the
            tool does not reach the snapshot at all.

    Toolset:
      type: object
      description: |
        A named, grantable group of tools. Replaces Bundle: a bundle grouped
        namespaces for publication, whereas a toolset is the unit an
        administrator hands to a user — and its name appears inside every grant
        scope, `t/<tenant>/ts/<toolset>`. See ADR 0016.
      required: [id, name, priority, namespaces]
      properties:
        id: { type: string }
        name: { type: string }
        priority:
          type: integer
          format: int32
          description: Leading component of the stable catalog ordering.
        token_budget: { type: integer, format: int32 }
        namespaces:
          type: array
          items: { type: string }
          description: Contributes every admitted tool in each named namespace.
        tools:
          type: array
          items: { type: string }
          description: |
            Individually named tools, qualified. A toolset draws from several
            namespaces, so a bare name would be ambiguous between them.
        exclude:
          type: array
          items: { type: string }

    Binding:
      type: object
      description: |
        One tenant's hosts for a backend. The same logical backend is a
        different deployment per tenant, and each is discovered and admitted
        separately (ADR 0017).
      required: [tenant, primary]
      properties:
        tenant: { type: string }
        primary:
          type: string
          description: |
            The definition source. Replicas are compared against it; one that
            diverges leaves the routable pool without changing the catalog.
        replicas:
          type: array
          items: { type: string }


    Policy:
      type: object
      description: |
        A named rule set, summarised. Rule bodies are not returned: the console
        renders them from the registry document.
      required: [id, name, priority, rule_count]
      properties:
        id: { type: string }
        name: { type: string }
        priority: { type: integer, format: int32 }
        rule_count: { type: integer }

    Plugin:
      type: object
      required: [id, name, runtime, hooks, priority, rollout]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        runtime:
          type: string
          enum: [wasm, grpc]
        hooks:
          type: array
          items: { type: string }
        priority: { type: integer, format: int32 }
        rollout:
          type: string
          enum: [shadow, canary, enforce]
          description: |
            Resolved, never empty. An unset rollout means `shadow`; reporting
            an empty value would make an inert plugin indistinguishable from an
            enforcing one.
        canary_percent: { type: integer, format: int32 }
        reads:
          type: array
          items: { type: string }
        writes:
          type: array
          items: { type: string }
          description: |
            The only paths this plugin may patch. A patch touching anything
            else is rejected whole, not partially applied.
        identity_dependent:
          type: boolean
          description: |
            Forces `cacheScope: private` at `on_catalog`. A catalog shaped by
            who is asking must never be cached publicly.
        artifact_digest:
          type: string
          description: |
            Checked before load. A mismatch refuses the plugin, which is what
            makes a swapped artifact fail closed.

    ServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/Server" }

    PluginList:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          items: { $ref: "#/components/schemas/Plugin" }

    RegistrySummary:
      type: object
      required: [valid, org, version, namespaces, servers, toolsets, policies, plugins]
      properties:
        file: { type: string }
        valid: { type: boolean }
        org: { type: string }
        version: { type: integer, format: int64 }
        namespaces: { type: integer }
        servers: { type: integer }
        toolsets: { type: integer }
        policies: { type: integer }
        plugins: { type: integer }

    ValidateRegistryRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: |
            The registry document as YAML. Validation runs against what the
            caller sends rather than what is on the server's disk, which is
            what makes this usable as a pull-request check.

    Snapshot:
      type: object
      required: [version, snapshot_id, org, built_at, age, key_id, algorithm, registry_digest, servable, tenants]
      properties:
        source:
          type: string
          description: |
            Where these bytes came from — a file path, or `uploaded`. Two
            snapshots that differ only in origin are otherwise
            indistinguishable, and that is exactly when it matters.
        version: { type: integer, format: int64 }
        snapshot_id: { type: string }
        org: { type: string }
        built_at: { type: string, format: date-time }
        age: { type: string }
        key_id: { type: string }
        algorithm: { type: string }
        registry_digest: { type: string }
        servable:
          type: boolean
          description: |
            Whether this snapshot would actually activate. A correctly signed
            snapshot with a dangling reference is refused by every data-plane
            instance, so signature validity alone is not the question anybody
            wants answered.
        unservable_reason: { type: string }
        tenants:
          type: array
          items: { $ref: "#/components/schemas/TenantSnapshotSummary" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolSummary" }

    TenantSnapshotSummary:
      type: object
      description: |
        One tenant's slice of a snapshot. What any given principal in that
        tenant sees is a subset, decided by their grants.
      required: [slug, name, tools, token_estimate]
      properties:
        slug: { type: string }
        name: { type: string }
        tools: { type: integer }
        token_estimate: { type: integer }

    ToolSummary:
      type: object
      required: [qualified_name, backend, effect_class, token_estimate, digest]
      properties:
        qualified_name: { type: string }
        backend: { type: string }
        effect_class:
          type: string
          enum: [read, write, destructive]
        token_estimate: { type: integer }
        digest: { type: string }

    InspectSnapshotRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          format: byte
          description: |
            The signed snapshot, base64-encoded. The bytes travel in the
            request rather than a path travelling in it: a server that opens
            whatever file a caller names is an arbitrary file read.
        tools:
          type: boolean
          description: List every tool rather than summarising by tenant.

    VerifySnapshotRequest:
      type: object
      required: [content, trusted_keys]
      properties:
        content: { type: string, format: byte }
        trusted_keys:
          type: array
          items: { type: string }
          description: |
            `keyID:base64PublicKey` entries, supplied by the caller rather than
            taken from server config — so this answers "would *that* data plane
            accept it?" for any data plane, not only the local one.

    VerifyReport:
      type: object
      required: [valid, version, key_id, tenants, tools]
      properties:
        source: { type: string }
        valid: { type: boolean }
        version: { type: integer, format: int64 }
        key_id: { type: string }
        tenants:
          type: array
          items: { type: string }
        tools: { type: integer }

    BuildSnapshotRequest:
      type: object
      description: |
        The registry and the signing key come from the server's configuration,
        not from this body. A caller who could name either could publish
        arbitrary configuration signed by the control plane's key.
      properties:
        allow_unreachable:
          type: boolean
          description: |
            Build even if a backend is down, omitting its tools. Tools from a
            merely temporarily-down backend would vanish from every catalog and
            invalidate clients' prompt caches, so this is for publishing around
            a decommissioned backend, not around an outage.
        dry_run:
          type: boolean
          description: Validate and report without writing the snapshot file.
        discover_timeout_ms: { type: integer }
        concurrency: { type: integer }

    BuildReport:
      type: object
      required: [version, snapshot_id, org, registry_digest, key_id, public_key, namespaces, servers, tools, bundles, audiences, plugins, backends, dry_run]
      properties:
        version: { type: integer, format: int64 }
        snapshot_id: { type: string }
        org: { type: string }
        registry_digest: { type: string }
        key_id: { type: string }
        public_key:
          type: string
          description: |
            The trust entry a data plane needs in order to accept what was just
            built.
        namespaces: { type: integer }
        servers: { type: integer }
        tools: { type: integer }
        toolsets: { type: integer }
        plugins: { type: integer }
        backends:
          type: array
          items: { $ref: "#/components/schemas/BackendReport" }
        warnings:
          type: array
          items: { type: string }
        output: { type: string }
        dry_run: { type: boolean }

    BackendReport:
      type: object
      description: |
        What discovery found at one backend. There is no `reachable` field and
        no error field: a backend that could not be reached fails the build
        unless `allow_unreachable` was set, in which case it appears in
        `warnings`. A per-backend error here would suggest a snapshot can be
        partly successful, and it cannot.
      required: [server_id, server_name, endpoint, tool_count, admitted, observed_at]
      properties:
        server_id: { type: string }
        server_name: { type: string }
        endpoint: { type: string }
        negotiated_version:
          type: string
          description: |
            The MCP version this backend actually agreed to — how a legacy
            backend becomes visible without anyone declaring it legacy.
        tool_count: { type: integer }
        admitted:
          type: array
          items: { type: string }
        excluded:
          type: array
          items: { type: string }
        observed_at: { type: string, format: date-time }

    GenerateSigningKeyRequest:
      type: object
      required: [key_id]
      properties:
        key_id:
          type: string
          description: |
            Recorded in every snapshot this key signs, and how a verifier
            selects the right public key during a rotation. Letters, digits,
            hyphen, underscore — it becomes a filename.

    SigningKey:
      type: object
      description: |
        The public half only. The private key is written to the control plane's
        key directory and never returned: whoever holds it can publish
        configuration to every data-plane instance, and an HTTP response lands
        in browser memory, a proxy log, and whatever the client does next.
      required: [key_id, directory, public_key, trust_entry]
      properties:
        key_id: { type: string }
        directory: { type: string }
        public_key: { type: string }
        trust_entry:
          type: string
          description: |
            The exact line to paste into a data plane's `trusted_signing_keys`.

    GatewayStatus:
      type: object
      required: [gateway_url, status, ready, snapshot_version, tenants, tools]
      properties:
        gateway_url: { type: string }
        status: { type: string }
        ready: { type: boolean }
        snapshot_version:
          type: integer
          format: int64
          description: |
            What is being served. Two instances reporting different versions is
            the signal that a rollout is mid-flight.
        tenants:
          type: integer
          description: |
            Tenants the gateway is serving. Replaces the audience count: with
            one endpoint and per-principal catalogs, "how many audiences" no
            longer describes anything (ADR 0019).
        tools: { type: integer }

    TenantList:
      allOf:
        - $ref: "#/components/schemas/GatewayStatus"
        - type: object
          description: |
            The live counts come from the data plane, which reports numbers
            rather than names: enumerating tenants to an unauthenticated caller
            is the same information leak enumerating audiences was.
          required: [registered]
          properties:
            registered:
              type: array
              items: { $ref: "#/components/schemas/TenantSummary" }

    TenantSummary:
      type: object
      required: [slug, name, status, tools]
      properties:
        slug: { type: string }
        name: { type: string }
        status: { type: string }
        tools: { type: integer }

    BackendHealthReport:
      type: object
      required: [summary, backends]
      properties:
        summary: { $ref: "#/components/schemas/BackendHealthSummary" }
        backends:
          type: array
          items: { $ref: "#/components/schemas/BackendHealth" }

    BackendHealthSummary:
      type: object
      required: [total, healthy, degraded, unavailable, drifted, unknown, blocked_tools]
      properties:
        total: { type: integer }
        healthy: { type: integer }
        degraded: { type: integer }
        unavailable: { type: integer }
        drifted: { type: integer }
        unknown: { type: integer }
        blocked_tools:
          type: integer
          description: |
            Tools refused because of drift. Zero in an all-advisory deployment
            however far its backends have moved.

    BackendHealth:
      type: object
      required: [server_id, server_name, endpoint, state, serving_mode, last_probe, consecutive_failures, latency_ewma_ms, tools_admitted, tools_observed]
      properties:
        server_id: { type: string }
        server_name: { type: string }
        endpoint: { type: string }
        state:
          type: string
          enum: [unknown, healthy, degraded, unavailable, drifted]
          description: |
            `unknown` is distinct from `healthy` on purpose: a gateway that has
            just started knows nothing about its backends, and reporting that
            as health would make the first minute after a deploy look better
            than it is. `degraded` means probes are failing but the grace
            window has not elapsed, so tools stay listed and their calls fail
            fast.
        serving_mode:
          type: string
          enum: [strict, advisory]
          description: |
            Carried alongside the drift because the same drift means different
            things under each: strict refuses, advisory serves and records.
        last_probe: { type: string, format: date-time }
        last_success: { type: string, format: date-time }
        consecutive_failures: { type: integer }
        latency_ewma_ms:
          type: integer
          format: int64
          description: |
            Smoothed probe latency. A single slow probe is noise; a rising
            average is a backend going bad before it starts failing.
        negotiated_version: { type: string }
        error: { type: string }
        tools_admitted: { type: integer }
        tools_observed: { type: integer }
        drift:
          type: array
          items: { $ref: "#/components/schemas/ToolDrift" }

    ToolDrift:
      type: object
      required: [name, kind, detail]
      properties:
        name:
          type: string
          description: The name the backend publishes.
        qualified_name:
          type: string
          description: |
            The name clients see. Absent for an added tool, which has none —
            assigning one is admission's job, and doing it at runtime would be
            exactly the auto-naming the design forbids.
        kind:
          type: string
          enum: [cosmetic, semantic, removed, added]
          description: |
            `cosmetic` is a changed description: the digest differs, the
            semantic digest does not, and the tool stays servable. `semantic`
            is a changed schema or annotation — the tool no longer does what
            was admitted. `removed` and `semantic` are the two that block under
            strict mode.
        admitted_digest: { type: string }
        observed_digest: { type: string }
        detail:
          type: string
          description: What changed, so a reader need not diff two digests by eye.

    Catalog:
      type: object
      description: |
        The tool list one identity receives. Produced by making the same
        request the agent makes, rather than by re-deriving policy — which is
        how people get this answer wrong.
      required: [tenant, protocol_version, server_name, ttl_ms, cache_scope, tools]
      properties:
        tenant: { type: string }
        subject: { type: string }
        protocol_version: { type: string }
        server_name: { type: string }
        ttl_ms: { type: integer }
        cache_scope:
          type: string
          enum: [public, private]
        tools:
          type: array
          items: { $ref: "#/components/schemas/CatalogTool" }

    CatalogTool:
      type: object
      required: [name, namespace]
      properties:
        name: { type: string }
        namespace: { type: string }
        title: { type: string }
        description: { type: string }

    CallToolRequest:
      type: object
      properties:
        credential:
          type: string
          description: |
            The API key to act as. Inspection presents what the principal
            presents rather than re-deriving what they should see (ADR 0019).
        subject: { type: string }
        groups:
          type: array
          items: { type: string }
        arguments:
          type: object
          additionalProperties: true
        request_state:
          type: string
          description: |
            Continues a deferred call — the signed envelope the gateway issued,
            echoed back unchanged.
        responses:
          type: object
          additionalProperties: { type: string }
          description: |
            Answers the gateway's input requests, keyed by request id. Each
            value is `accept`, `decline`, `cancel`, or `text:<value>`.

    CallResult:
      type: object
      required: [tool, is_error, needs_input, duration_ms, text]
      properties:
        tool: { type: string }
        is_error:
          type: boolean
          description: |
            A tool that returned an error is still a successful inspection —
            the operator asked what happens, and this is what happens. The HTTP
            status stays 200.
        needs_input:
          type: boolean
          description: |
            An MRTR deferral. The call did not fail; it is waiting for a human.
        duration_ms: { type: integer, format: int64 }
        text: { type: string }
        gateway_detail:
          description: |
            The gateway's own `_meta` annotation — which plugin mutated the
            result, which hook denied it. Shaped by the pipeline rather than by
            this API, so it is returned as-is.
        input_requests:
          type: array
          items: { type: string }
        request_state:
          type: string
          description: |
            The signed envelope to send back with the answers. Unforgeable, not
            secret: a client can decode it and see what it binds.
