openapi: 3.1.0

info:
  title: MCPDoll Control Plane API
  version: 0.1.0
  summary: The single contract behind MCPDoll's API, CLI, and console.
  description: |
    This document is the source of truth for every MCPDoll operation. The Go
    server interfaces, the Go client the CLI uses, the TypeScript client the
    console uses, and `docs/api/` are all generated from it.

    Two rules make that more than a slogan:

    - **The CLI is an API client and never touches the database.** Anything the
      CLI can do, an external integrator can do, because the CLI has no
      privileged path.
    - **Every operation declares its surfaces** in `x-mcpdoll-surfaces`, and
      `make parity` fails the build if an operation lacks a CLI command or a UI
      route, or if a CLI or UI binding names an operation that does not exist.

    See `docs/adr/0004-api-first-tri-surface.md`.

    ## What this version covers

    The registry is a reviewable YAML document rather than database rows, and
    the control plane's durable side is not built (see `docs/deferred.md`). So
    the operations here are the ones that are genuinely implemented: reading the
    registry, inspecting and verifying snapshots, and observing a live data
    plane. Registry *mutation* through the API arrives with the database.

  license:
    name: MIT

servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: registry
    description: The declarative registry document
  - name: snapshots
    description: Signed serving configuration
  - name: gateway
    description: A live data plane
  - name: plugins
    description: Pipeline plugins and their rollout state
  - name: system
    description: Health and metadata

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness
      tags: [system]
      x-mcpdoll-surfaces:
        cli: mcpdoll system health
        ui: /system/health
      responses:
        "200":
          description: The control plane is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/hooks:
    get:
      operationId: listHooks
      summary: List the seven pipeline hooks
      description: |
        The set is closed. Adding an eighth requires an ADR, so this list is a
        contract rather than a convenience.
      tags: [plugins]
      x-mcpdoll-surfaces:
        cli: mcpdoll registry hooks
        ui: /plugins/hooks
      responses:
        "200":
          description: The hooks, in execution order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HookList" }

  /api/v1/registry:
    get:
      operationId: getRegistry
      summary: Read the resolved registry document
      tags: [registry]
      x-mcpdoll-surfaces:
        cli: mcpdoll registry show
        ui: /registry
      responses:
        "200":
          description: The registry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registry" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/registry:validate:
    post:
      operationId: validateRegistry
      summary: Validate a registry document without contacting any backend
      description: |
        Structure and internal consistency only: unknown keys, dangling
        references, duplicate prefixes, TTLs that try to widen rather than
        narrow. Offline, so it belongs in a pull-request check.
      tags: [registry]
      x-mcpdoll-surfaces:
        cli: mcpdoll registry validate
        ui: /registry/validate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateRegistryRequest" }
      responses:
        "200":
          description: The document is valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrySummary" }
        "422":
          description: The document is invalid, with every problem listed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/registry/servers:
    get:
      operationId: listServers
      summary: List the registered backends
      tags: [registry]
      x-mcpdoll-surfaces:
        cli: mcpdoll registry servers
        ui: /registry/servers
      responses:
        "200":
          description: The backends
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerList" }

  /api/v1/registry/servers/{serverId}:
    get:
      operationId: getServer
      summary: Read one backend
      tags: [registry]
      x-mcpdoll-surfaces:
        cli: mcpdoll registry servers show
        ui: /registry/servers/:serverId
      parameters:
        - $ref: "#/components/parameters/ServerId"
      responses:
        "200":
          description: The backend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/snapshots/current:
    get:
      operationId: getCurrentSnapshot
      summary: Read the snapshot the gateway is serving
      tags: [snapshots]
      x-mcpdoll-surfaces:
        cli: mcpdoll snapshot current
        ui: /snapshots
      responses:
        "200":
          description: The snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/snapshots:inspect:
    post:
      operationId: inspectSnapshot
      summary: Show what a snapshot file contains
      description: |
        Reads a snapshot *without* verifying it, so one signed by a key you do
        not hold can still be inspected — which is exactly when inspection is
        most useful. Use `verifySnapshot` to check the signature.
      tags: [snapshots]
      x-mcpdoll-surfaces:
        cli: mcpdoll snapshot inspect
        ui: /snapshots/inspect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InspectSnapshotRequest" }
      responses:
        "200":
          description: The snapshot's contents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/snapshots:build:
    post:
      operationId: buildSnapshot
      summary: Resolve the registry into a signed snapshot
      description: |
        Discovers every backend the registry names, canonicalizes what they
        publish, and signs the result. Every problem is a build failure: a
        snapshot some data-plane instances would refuse is worse than none.
      tags: [snapshots]
      x-mcpdoll-surfaces:
        cli: mcpdoll snapshot build
        ui: /snapshots/build
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildSnapshotRequest" }
      responses:
        "200":
          description: The build report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildReport" }
        "422":
          description: The snapshot could not be built
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/snapshots:verify:
    post:
      operationId: verifySnapshot
      summary: Check a snapshot's signature and that it would activate
      description: |
        Both halves matter. A correctly signed snapshot with a dangling
        reference is refused by every data-plane instance.
      tags: [snapshots]
      x-mcpdoll-surfaces:
        cli: mcpdoll snapshot verify
        ui: /snapshots/verify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifySnapshotRequest" }
      responses:
        "200":
          description: The verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyReport" }
        "422":
          description: The snapshot failed verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/keys:generate:
    post:
      operationId: generateSigningKey
      summary: Mint an Ed25519 snapshot signing keypair
      description: |
        For local development. The private key is written unencrypted; whoever
        holds it can publish configuration to every data-plane instance, so
        production keys must come from your key management system.
      tags: [snapshots]
      x-mcpdoll-surfaces:
        cli: mcpdoll keys generate
        ui: /snapshots/keys
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateSigningKeyRequest" }
      responses:
        "200":
          description: The generated key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }

  /api/v1/plugins:
    get:
      operationId: listPlugins
      summary: List the pipeline plugins and their rollout state
      tags: [plugins]
      x-mcpdoll-surfaces:
        cli: mcpdoll plugins list
        ui: /plugins
      responses:
        "200":
          description: The plugins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginList" }

  /api/v1/gateway/status:
    get:
      operationId: getGatewayStatus
      summary: Report which snapshot a data plane is serving
      tags: [gateway]
      x-mcpdoll-surfaces:
        cli: mcpdoll gateway status
        ui: /gateway
      responses:
        "200":
          description: The gateway's status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayStatus" }
        "503":
          description: The gateway is not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayStatus" }

  /api/v1/gateway/backends:
    get:
      operationId: listBackends
      summary: What the gateway's prober knows about each backend
      description: |
        Every backend's condition, and how far each has drifted from what was
        admitted. Drift is the interesting column: the gateway serves admitted
        definitions and never live backend output, which makes a backend
        changing its catalog a detectable event rather than a silent change to
        what clients see — but only because something looks.

        `blocked_tools` is what a strict backend's drift actually costs. In
        advisory mode it is always zero however far the backend has moved.
      tags: [gateway]
      x-mcpdoll-surfaces:
        cli: mcpdoll gateway backends
        ui: /gateway/backends
      responses:
        "200":
          description: Backend conditions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendHealthReport" }
        "502": { $ref: "#/components/responses/Unavailable" }

  /api/v1/tenants:
    get:
      operationId: listTenants
      summary: Every tenant, joined across the three places a tenant exists
      description: |
        A tenant is a record in the database, a set of bindings in the registry,
        and a slice of the serving snapshot. Those drift apart in ways that are
        individually invisible: a tenant with users and no bindings has nothing
        to serve, and a binding for a tenant nobody created has nothing to
        authenticate against. Reporting all three together is what makes either
        mistake findable.

        A slug that appears only in the registry is listed with status
        `unregistered` and no id.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll tenants list
        ui: /tenants
      responses:
        "200":
          description: The tenants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantList" }

    post:
      operationId: createTenant
      summary: Create a tenant
      description: |
        The slug appears verbatim in every scope string this tenant's grants
        use, so it is immutable once created. There is no rename operation for
        exactly that reason: renaming would orphan every grant naming it.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll tenants create
        ui: /tenants/new
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "201":
          description: The tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/NoDatabase" }

  /api/v1/tenants/{tenantId}:
    delete:
      operationId: deleteTenant
      summary: Delete a tenant and everything it owns
      description: |
        Cascades to the tenant's users, their grants, and their API keys. The
        cascade is the schema's, which is what makes the deletion complete
        without anybody having to remember every table.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll tenants delete
        ui: /tenants/:tenantId/delete
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoDatabase" }

  /api/v1/tenants/{tenantId}/users:
    get:
      operationId: listUsers
      summary: Every user in one tenant
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll users list
        ui: /tenants/:tenantId/users
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoDatabase" }

    post:
      operationId: createUser
      summary: Add a user to a tenant
      description: |
        The password is optional: a user who signs in through an identity
        provider has none, and a service identity that only ever holds API keys
        does not need one.

        A new user holds no grants. That is the correct starting state rather
        than an omission — an account that could see tools the moment it existed
        would make onboarding the thing that grants access.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll users create
        ui: /tenants/:tenantId/users/new
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/NoDatabase" }

  /api/v1/users/{userId}:
    get:
      operationId: getUser
      summary: One user
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll users show
        ui: /users/:userId
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoDatabase" }

    patch:
      operationId: updateUser
      summary: Change a user's display name or status
      description: |
        Setting the status to `disabled` stops the user's API keys too, because
        a key's effective grants are recomputed from its owner at every
        resolution. That is what makes offboarding one operation rather than a
        hunt through credentials.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll users update
        ui: /users/:userId/edit
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoDatabase" }

  /api/v1/users/{userId}/grants:
    get:
      operationId: listGrants
      summary: What a user holds directly
      description: |
        Directly: an API key's effective grants are the intersection of what the
        key declares with this set, recomputed at every resolution, so a key can
        narrow what its owner holds but never widen it.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll users grants
        ui: /users/:userId/grants
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantList" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoDatabase" }

    put:
      operationId: putGrants
      summary: Set a user's grants to exactly this set
      description: |
        Declarative rather than add-one/remove-one. The question an operator is
        answering is "what should this person hold", and expressing that as a
        sequence of deltas is exactly how a revocation gets forgotten.

        A grant naming a role the catalog does not define is refused rather than
        stored: it would authorize nothing, so accepting it would report success
        for a change that does not take effect.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll users grants set
        ui: /users/:userId/grants/edit
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutGrantsRequest" }
      responses:
        "200":
          description: The grants the user now holds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantList" }
        "400": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoDatabase" }

  /api/v1/users/{userId}/keys:
    get:
      operationId: listAPIKeys
      summary: Every API key a user holds, revoked ones included
      description: |
        Revoked keys stay listed. A credential that was in use and is not any
        more is the thing an incident review needs to see, and removing the row
        would remove the evidence.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll users keys
        ui: /users/:userId/keys
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyList" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoDatabase" }

    post:
      operationId: mintAPIKey
      summary: Mint an API key
      description: |
        The only response in this API that carries a secret. The key is stored
        only as an Argon2id hash, so a caller who does not capture it here has
        to mint another one — which is the property that makes a leaked log
        harmless.

        Declared grants are intersected with the owner's at every resolution, so
        a key can narrow its owner's access but never widen it. Declaring more
        than the owner holds is not an error; it simply has no effect.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll users keys mint
        ui: /users/:userId/keys/new
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MintAPIKeyRequest" }
      responses:
        "201":
          description: The key and its secret, once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MintedAPIKey" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoDatabase" }

  /api/v1/keys/{keyId}:
    delete:
      operationId: revokeAPIKey
      summary: Revoke an API key
      description: |
        Marks the key revoked rather than deleting the row, so the credential
        stops working and the record of it having existed does not.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll users keys revoke
        ui: /users/:userId/keys/:keyId/revoke
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoDatabase" }

  /api/v1/roles:
    get:
      operationId: listRoles
      summary: The role catalog and every permission that exists
      description: |
        `permissions` is the closed set, not only the ones some role happens to
        use. A UI offered only the latter could never grant a new one, and the
        set being closed is what keeps it reviewable.

        Answers from the database when one is configured, and from the built-in
        defaults otherwise — which is also what a fresh install authorizes
        against before anybody has seeded it.
      tags: [tenancy]
      x-mcpdoll-surfaces:
        cli: mcpdoll roles
        ui: /roles
      responses:
        "200":
          description: The role catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleCatalog" }

  /api/v1/gateway/catalog:
    get:
      operationId: getCatalog
      summary: List the tools an identity actually sees
      description: |
        Connects to the data plane as a real MCP client, as the given identity,
        and returns the catalog it receives — including `ttlMs` and
        `cacheScope`.

        This is the answer to "which tools can this agent call?" that cannot be
        wrong, because it is the same request the agent makes.
      tags: [gateway]
      x-mcpdoll-surfaces:
        cli: mcpdoll gateway catalog
        ui: /gateway/catalog
      parameters:
        - name: subject
          in: query
          description: Principal subject to present
          schema: { type: string }
        - name: groups
          in: query
          description: Comma-separated IdP groups to present
          schema: { type: string }
      responses:
        "200":
          description: The catalog that identity receives
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gateway/tools/{toolName}:call:
    post:
      operationId: callTool
      summary: Call a tool through the gateway as a chosen identity
      description: |
        Invokes the tool as a real MCP client would, so what you see is what an
        agent would see — including a policy denial or a grace-window
        unavailability, both of which arrive as tool errors rather than
        transport failures.
      tags: [gateway]
      x-mcpdoll-surfaces:
        cli: mcpdoll gateway call
        ui: /gateway/playground
      parameters:
        - name: toolName
          in: path
          required: true
          description: The qualified tool name
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallToolRequest" }
      responses:
        "200":
          description: The tool result, including a tool-level error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallResult" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      description: The backend's registry id
      schema: { type: string }

  responses:
    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Conflict:
      description: |
        The request is legitimate but conflicts with existing state — a slug or
        an email already taken. Not a 500: telling the caller the server broke
        sends them to the wrong place.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NoDatabase:
      description: |
        This control plane has no database configured, so it holds no tenants or
        users. A legitimate deployment — a snapshot builder in CI has no
        business holding user records — which is why it is reported rather than
        hidden behind an empty list.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Unavailable:
      description: |
        The data plane could not be reached. Distinct from a 403, which means
        it answered and refused — reporting an authorization decision as an
        outage sends the reader to the wrong system.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # Every schema here is checked against the Go struct that produces it, by
    # internal/api/schema_test.go. A field renamed on one side and not the other
    # fails the build rather than reaching a client as `undefined`.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable token. Clients switch on this; the message
            is for humans and may be reworded.
          enum:
            - invalid_request
            - not_found
            - forbidden
            - validation_failed
            - upstream_unavailable
            - internal_error
        message:
          type: string
          description: One sentence, written for whoever has to fix the problem.
        problems:
          type: array
          items: { type: string }
          description: |
            Every distinct failure. Validation returns all of them at once: a
            document with six errors should take one round trip to fix.

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string }
        version: { type: string }
        registry_path:
          type: string
          description: |
            The document this control plane is serving. Unexpected output is
            nearly always the wrong file rather than the wrong logic.
        snapshot_path: { type: string }

    HookList:
      type: object
      required: [hooks]
      properties:
        hooks:
          type: array
          items: { type: string }
          description: The seven hooks, in execution order. The set is closed.

    Registry:
      type: object
      description: |
        A registry document with defaults resolved. Not the on-disk YAML: an
        unset `serving_mode` reads as `strict` here because that is what the
        engine will do, and rule bodies are summarised to counts.
      required: [org, version, namespaces, servers, toolsets]
      properties:
        org: { type: string }
        version: { type: integer, format: int64 }
        namespaces:
          type: array
          items: { $ref: "#/components/schemas/Namespace" }
        servers:
          type: array
          items: { $ref: "#/components/schemas/Server" }
        toolsets:
          type: array
          items: { $ref: "#/components/schemas/Toolset" }
        policies:
          type: array
          items: { $ref: "#/components/schemas/Policy" }
        plugins:
          type: array
          items: { $ref: "#/components/schemas/Plugin" }

    Namespace:
      type: object
      required: [id, name, prefix]
      properties:
        id: { type: string }
        name: { type: string }
        prefix:
          type: string
          description: |
            What every tool in this namespace is served under, and why two
            namespaces cannot share one.
        owner_idp_group: { type: string }
        team: { type: string }
        project: { type: string }

    Server:
      type: object
      required: [id, name, namespace, bindings, serving_mode, default_effect_class]
      properties:
        id: { type: string }
        name: { type: string }
        namespace: { type: string }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/Binding" }
        serving_mode:
          type: string
          enum: [strict, advisory]
          description: |
            Resolved, never empty. `strict` refuses to serve a definition that
            has drifted from what was admitted; `advisory` serves it and
            records the drift.
        criticality: { type: string }
        data_classification: { type: string }
        compliance_scope:
          type: array
          items: { type: string }
        default_effect_class:
          type: string
          enum: [read, write, destructive]
        canary_tool:
          type: string
          description: |
            Probed to decide whether this backend is healthy, rather than
            trusting a transport-level ping.
        tool_overrides:
          type: object
          additionalProperties: { type: string }
          description: |
            Tools whose effect class the registry states explicitly. Everything
            else inherits `default_effect_class`.
        excluded_tools:
          type: array
          items: { type: string }
          description: |
            Withheld from every toolset. Kept separate from `tool_overrides`
            because an exclusion is not an override with a blank class — the
            tool does not reach the snapshot at all.

    Toolset:
      type: object
      description: |
        A named, grantable group of tools. Replaces Bundle: a bundle grouped
        namespaces for publication, whereas a toolset is the unit an
        administrator hands to a user — and its name appears inside every grant
        scope, `t/<tenant>/ts/<toolset>`. See ADR 0016.
      required: [id, name, priority, namespaces]
      properties:
        id: { type: string }
        name: { type: string }
        priority:
          type: integer
          format: int32
          description: Leading component of the stable catalog ordering.
        token_budget: { type: integer, format: int32 }
        namespaces:
          type: array
          items: { type: string }
          description: Contributes every admitted tool in each named namespace.
        tools:
          type: array
          items: { type: string }
          description: |
            Individually named tools, qualified. A toolset draws from several
            namespaces, so a bare name would be ambiguous between them.
        exclude:
          type: array
          items: { type: string }

    Binding:
      type: object
      description: |
        One tenant's hosts for a backend. The same logical backend is a
        different deployment per tenant, and each is discovered and admitted
        separately (ADR 0017).
      required: [tenant, primary]
      properties:
        tenant: { type: string }
        primary:
          type: string
          description: |
            The definition source. Replicas are compared against it; one that
            diverges leaves the routable pool without changing the catalog.
        replicas:
          type: array
          items: { type: string }


    Policy:
      type: object
      description: |
        A named rule set, summarised. Rule bodies are not returned: the console
        renders them from the registry document.
      required: [id, name, priority, rule_count]
      properties:
        id: { type: string }
        name: { type: string }
        priority: { type: integer, format: int32 }
        rule_count: { type: integer }

    Plugin:
      type: object
      required: [id, name, runtime, hooks, priority, rollout]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        runtime:
          type: string
          enum: [wasm, grpc]
        hooks:
          type: array
          items: { type: string }
        priority: { type: integer, format: int32 }
        rollout:
          type: string
          enum: [shadow, canary, enforce]
          description: |
            Resolved, never empty. An unset rollout means `shadow`; reporting
            an empty value would make an inert plugin indistinguishable from an
            enforcing one.
        canary_percent: { type: integer, format: int32 }
        reads:
          type: array
          items: { type: string }
        writes:
          type: array
          items: { type: string }
          description: |
            The only paths this plugin may patch. A patch touching anything
            else is rejected whole, not partially applied.
        identity_dependent:
          type: boolean
          description: |
            Forces `cacheScope: private` at `on_catalog`. A catalog shaped by
            who is asking must never be cached publicly.
        artifact_digest:
          type: string
          description: |
            Checked before load. A mismatch refuses the plugin, which is what
            makes a swapped artifact fail closed.

    ServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/Server" }

    PluginList:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          items: { $ref: "#/components/schemas/Plugin" }

    RegistrySummary:
      type: object
      required: [valid, org, version, namespaces, servers, toolsets, policies, plugins]
      properties:
        file: { type: string }
        valid: { type: boolean }
        org: { type: string }
        version: { type: integer, format: int64 }
        namespaces: { type: integer }
        servers: { type: integer }
        toolsets: { type: integer }
        policies: { type: integer }
        plugins: { type: integer }

    ValidateRegistryRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: |
            The registry document as YAML. Validation runs against what the
            caller sends rather than what is on the server's disk, which is
            what makes this usable as a pull-request check.

    Snapshot:
      type: object
      required: [version, snapshot_id, org, built_at, age, key_id, algorithm, registry_digest, servable, tenants]
      properties:
        source:
          type: string
          description: |
            Where these bytes came from — a file path, or `uploaded`. Two
            snapshots that differ only in origin are otherwise
            indistinguishable, and that is exactly when it matters.
        version: { type: integer, format: int64 }
        snapshot_id: { type: string }
        org: { type: string }
        built_at: { type: string, format: date-time }
        age: { type: string }
        key_id: { type: string }
        algorithm: { type: string }
        registry_digest: { type: string }
        servable:
          type: boolean
          description: |
            Whether this snapshot would actually activate. A correctly signed
            snapshot with a dangling reference is refused by every data-plane
            instance, so signature validity alone is not the question anybody
            wants answered.
        unservable_reason: { type: string }
        tenants:
          type: array
          items: { $ref: "#/components/schemas/TenantSnapshotSummary" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolSummary" }

    TenantSnapshotSummary:
      type: object
      description: |
        One tenant's slice of a snapshot. What any given principal in that
        tenant sees is a subset, decided by their grants.
      required: [slug, name, tools, token_estimate]
      properties:
        slug: { type: string }
        name: { type: string }
        tools: { type: integer }
        token_estimate: { type: integer }

    ToolSummary:
      type: object
      required: [qualified_name, backend, effect_class, token_estimate, digest]
      properties:
        qualified_name: { type: string }
        backend: { type: string }
        effect_class:
          type: string
          enum: [read, write, destructive]
        token_estimate: { type: integer }
        digest: { type: string }

    InspectSnapshotRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          format: byte
          description: |
            The signed snapshot, base64-encoded. The bytes travel in the
            request rather than a path travelling in it: a server that opens
            whatever file a caller names is an arbitrary file read.
        tools:
          type: boolean
          description: List every tool rather than summarising by tenant.

    VerifySnapshotRequest:
      type: object
      required: [content, trusted_keys]
      properties:
        content: { type: string, format: byte }
        trusted_keys:
          type: array
          items: { type: string }
          description: |
            `keyID:base64PublicKey` entries, supplied by the caller rather than
            taken from server config — so this answers "would *that* data plane
            accept it?" for any data plane, not only the local one.

    VerifyReport:
      type: object
      required: [valid, version, key_id, tenants, tools]
      properties:
        source: { type: string }
        valid: { type: boolean }
        version: { type: integer, format: int64 }
        key_id: { type: string }
        tenants:
          type: array
          items: { type: string }
        tools: { type: integer }

    BuildSnapshotRequest:
      type: object
      description: |
        The registry and the signing key come from the server's configuration,
        not from this body. A caller who could name either could publish
        arbitrary configuration signed by the control plane's key.
      properties:
        allow_unreachable:
          type: boolean
          description: |
            Build even if a backend is down, omitting its tools. Tools from a
            merely temporarily-down backend would vanish from every catalog and
            invalidate clients' prompt caches, so this is for publishing around
            a decommissioned backend, not around an outage.
        dry_run:
          type: boolean
          description: Validate and report without writing the snapshot file.
        discover_timeout_ms: { type: integer }
        concurrency: { type: integer }
        version:
          type: integer
          format: int64
          description: |
            Overrides the snapshot version. Absent means a Unix timestamp,
            which is what a grants-only republish wants: monotonic without
            anybody coordinating, and nothing to forget to bump. The data plane
            refuses anything no newer than what it is serving.

    BuildReport:
      type: object
      required: [version, snapshot_id, org, registry_digest, key_id, public_key, namespaces, servers, tools, toolsets, plugins, backends, dry_run]
      properties:
        version: { type: integer, format: int64 }
        snapshot_id: { type: string }
        org: { type: string }
        registry_digest: { type: string }
        key_id: { type: string }
        public_key:
          type: string
          description: |
            The trust entry a data plane needs in order to accept what was just
            built.
        namespaces: { type: integer }
        servers: { type: integer }
        tools: { type: integer }
        toolsets: { type: integer }
        plugins: { type: integer }
        backends:
          type: array
          items: { $ref: "#/components/schemas/BackendReport" }
        warnings:
          type: array
          items: { type: string }
        output: { type: string }
        dry_run: { type: boolean }

    BackendReport:
      type: object
      description: |
        What discovery found at one backend. There is no `reachable` field and
        no error field: a backend that could not be reached fails the build
        unless `allow_unreachable` was set, in which case it appears in
        `warnings`. A per-backend error here would suggest a snapshot can be
        partly successful, and it cannot.
      required: [server_id, server_name, endpoint, tool_count, admitted, observed_at]
      properties:
        server_id: { type: string }
        server_name: { type: string }
        endpoint: { type: string }
        negotiated_version:
          type: string
          description: |
            The MCP version this backend actually agreed to — how a legacy
            backend becomes visible without anyone declaring it legacy.
        tool_count: { type: integer }
        admitted:
          type: array
          items: { type: string }
        excluded:
          type: array
          items: { type: string }
        observed_at: { type: string, format: date-time }

    GenerateSigningKeyRequest:
      type: object
      required: [key_id]
      properties:
        key_id:
          type: string
          description: |
            Recorded in every snapshot this key signs, and how a verifier
            selects the right public key during a rotation. Letters, digits,
            hyphen, underscore — it becomes a filename.

    SigningKey:
      type: object
      description: |
        The public half only. The private key is written to the control plane's
        key directory and never returned: whoever holds it can publish
        configuration to every data-plane instance, and an HTTP response lands
        in browser memory, a proxy log, and whatever the client does next.
      required: [key_id, directory, public_key, trust_entry]
      properties:
        key_id: { type: string }
        directory: { type: string }
        public_key: { type: string }
        trust_entry:
          type: string
          description: |
            The exact line to paste into a data plane's `trusted_signing_keys`.

    GatewayStatus:
      type: object
      required: [gateway_url, status, ready, snapshot_version, tenants, tools]
      properties:
        gateway_url: { type: string }
        status: { type: string }
        ready: { type: boolean }
        snapshot_version:
          type: integer
          format: int64
          description: |
            What is being served. Two instances reporting different versions is
            the signal that a rollout is mid-flight.
        tenants:
          type: integer
          description: |
            Tenants the gateway is serving. Replaces the audience count: with
            one endpoint and per-principal catalogs, "how many audiences" no
            longer describes anything (ADR 0019).
        tools: { type: integer }

    TenantList:
      allOf:
        - $ref: "#/components/schemas/GatewayStatus"
        - type: object
          description: |
            The live counts come from the data plane, which reports numbers
            rather than names: enumerating tenants to an unauthenticated caller
            is the same information leak enumerating audiences was.
          required: [registered]
          properties:
            registered:
              type: array
              items: { $ref: "#/components/schemas/TenantSummary" }

    TenantSummary:
      type: object
      description: |
        One tenant, joined across the database, the registry, and the serving
        snapshot. `users` of zero with a positive `backends` is a tenant nothing
        can authenticate into; `backends` of zero is a tenant no tool can reach
        whatever grants its users hold.
      required: [slug, name, status, users, backends, tools]
      properties:
        id:
          type: string
          format: uuid
          description: Absent for a slug that appears only in the registry.
        slug: { type: string }
        name: { type: string }
        status:
          type: string
          description: |
            The tenant's own status, or `unregistered` for a slug the registry
            binds but nobody created.
        users: { type: integer }
        backends:
          type: integer
          description: Registry bindings naming this tenant.
        tools:
          type: integer
          description: Tools the serving snapshot admits for this tenant.
        created_at: { type: string, format: date-time }

    Tenant:
      type: object
      required: [id, slug, name, status, created_at]
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          description: |
            Appears verbatim in every scope string this tenant's grants use, and
            is immutable for that reason.
        name: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }

    CreateTenantRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    User:
      type: object
      required: [id, tenant_id, tenant, email, status, has_password, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        tenant:
          type: string
          description: |
            The slug, carried alongside the id because every scope string this
            user appears in is written with the slug, not the uuid.
        email: { type: string }
        display_name: { type: string }
        status:
          type: string
          enum: [active, disabled]
        has_password:
          type: boolean
          description: |
            Whether local sign-in is possible. Never the hash — that is the only
            thing safe to say and the only thing any caller needs.
        created_at: { type: string, format: date-time }

    UserList:
      type: object
      required: [tenant, users]
      properties:
        tenant: { type: string }
        users:
          type: array
          items: { $ref: "#/components/schemas/User" }

    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
        display_name: { type: string }
        password:
          type: string
          description: |
            Optional. A user who signs in through an identity provider has none,
            and a service identity that only holds API keys does not need one.

    UpdateUserRequest:
      type: object
      required: [status]
      properties:
        display_name: { type: string }
        status:
          type: string
          enum: [active, disabled]

    Grant:
      type: object
      description: |
        One role held at one scope. Scopes nest: `*` covers everything,
        `t/<tenant>` covers a tenant, `t/<tenant>/ts/<toolset>` a toolset, and
        `t/<tenant>/ts/<toolset>/<tool>` a single tool.
      required: [role, scope]
      properties:
        role: { type: string }
        scope: { type: string }

    GrantList:
      type: object
      required: [user_id, grants]
      properties:
        user_id: { type: string, format: uuid }
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }

    PutGrantsRequest:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          description: The complete set the user should hold. Anything absent is revoked.
          items: { $ref: "#/components/schemas/Grant" }

    APIKey:
      type: object
      required: [id, user_id, name, prefix, declared_grants, active, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: |
            The lookup half of the key, public by construction: it identifies
            the row before anything is verified.
        declared_grants:
          type: array
          description: |
            What the key asks for. Effective grants are this intersected with
            the owner's, so a key can narrow but never widen.
          items: { $ref: "#/components/schemas/Grant" }
        active:
          type: boolean
          description: |
            Whether this key would authenticate right now — not derivable from
            any single timestamp below.
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    APIKeyList:
      type: object
      required: [user_id, keys]
      properties:
        user_id: { type: string, format: uuid }
        keys:
          type: array
          items: { $ref: "#/components/schemas/APIKey" }

    MintAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        expires_at:
          type: string
          format: date-time
          description: Absent means the key does not expire.

    MintedAPIKey:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: "#/components/schemas/APIKey" }
        secret:
          type: string
          description: |
            The only place this will ever appear. Stored as an Argon2id hash, so
            a caller who does not capture it has to mint another key.

    Role:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string }
        permissions:
          type: array
          items: { type: string }

    RoleCatalog:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          description: |
            Every permission that exists, not only the ones some role uses.
            Adding one is a schema change and a UI change — friction that exists
            because a permission set which grows casually stops being
            reviewable.
          items: { type: string }

    BackendHealthReport:
      type: object
      required: [summary, backends]
      properties:
        summary: { $ref: "#/components/schemas/BackendHealthSummary" }
        backends:
          type: array
          items: { $ref: "#/components/schemas/BackendHealth" }

    BackendHealthSummary:
      type: object
      required: [total, healthy, degraded, unavailable, drifted, unknown, blocked_tools]
      properties:
        total: { type: integer }
        healthy: { type: integer }
        degraded: { type: integer }
        unavailable: { type: integer }
        drifted: { type: integer }
        unknown: { type: integer }
        blocked_tools:
          type: integer
          description: |
            Tools refused because of drift. Zero in an all-advisory deployment
            however far its backends have moved.

    BackendHealth:
      type: object
      required: [server_id, server_name, endpoint, state, serving_mode, last_probe, consecutive_failures, latency_ewma_ms, tools_admitted, tools_observed]
      properties:
        server_id: { type: string }
        server_name: { type: string }
        endpoint: { type: string }
        state:
          type: string
          enum: [unknown, healthy, degraded, unavailable, drifted]
          description: |
            `unknown` is distinct from `healthy` on purpose: a gateway that has
            just started knows nothing about its backends, and reporting that
            as health would make the first minute after a deploy look better
            than it is. `degraded` means probes are failing but the grace
            window has not elapsed, so tools stay listed and their calls fail
            fast.
        serving_mode:
          type: string
          enum: [strict, advisory]
          description: |
            Carried alongside the drift because the same drift means different
            things under each: strict refuses, advisory serves and records.
        last_probe: { type: string, format: date-time }
        last_success: { type: string, format: date-time }
        consecutive_failures: { type: integer }
        latency_ewma_ms:
          type: integer
          format: int64
          description: |
            Smoothed probe latency. A single slow probe is noise; a rising
            average is a backend going bad before it starts failing.
        negotiated_version: { type: string }
        error: { type: string }
        tools_admitted: { type: integer }
        tools_observed: { type: integer }
        drift:
          type: array
          items: { $ref: "#/components/schemas/ToolDrift" }

    ToolDrift:
      type: object
      required: [name, kind, detail]
      properties:
        name:
          type: string
          description: The name the backend publishes.
        qualified_name:
          type: string
          description: |
            The name clients see. Absent for an added tool, which has none —
            assigning one is admission's job, and doing it at runtime would be
            exactly the auto-naming the design forbids.
        kind:
          type: string
          enum: [cosmetic, semantic, removed, added]
          description: |
            `cosmetic` is a changed description: the digest differs, the
            semantic digest does not, and the tool stays servable. `semantic`
            is a changed schema or annotation — the tool no longer does what
            was admitted. `removed` and `semantic` are the two that block under
            strict mode.
        admitted_digest: { type: string }
        observed_digest: { type: string }
        detail:
          type: string
          description: What changed, so a reader need not diff two digests by eye.

    Catalog:
      type: object
      description: |
        The tool list one identity receives. Produced by making the same
        request the agent makes, rather than by re-deriving policy — which is
        how people get this answer wrong.
      required: [tenant, protocol_version, server_name, ttl_ms, cache_scope, tools]
      properties:
        tenant: { type: string }
        subject: { type: string }
        protocol_version: { type: string }
        server_name: { type: string }
        ttl_ms: { type: integer }
        cache_scope:
          type: string
          enum: [public, private]
        tools:
          type: array
          items: { $ref: "#/components/schemas/CatalogTool" }

    CatalogTool:
      type: object
      required: [name, namespace]
      properties:
        name: { type: string }
        namespace: { type: string }
        title: { type: string }
        description: { type: string }

    CallToolRequest:
      type: object
      properties:
        credential:
          type: string
          description: |
            The API key to act as. Inspection presents what the principal
            presents rather than re-deriving what they should see (ADR 0019).
        subject: { type: string }
        groups:
          type: array
          items: { type: string }
        arguments:
          type: object
          additionalProperties: true
        request_state:
          type: string
          description: |
            Continues a deferred call — the signed envelope the gateway issued,
            echoed back unchanged.
        responses:
          type: object
          additionalProperties: { type: string }
          description: |
            Answers the gateway's input requests, keyed by request id. Each
            value is `accept`, `decline`, `cancel`, or `text:<value>`.

    CallResult:
      type: object
      required: [tool, is_error, needs_input, duration_ms, text]
      properties:
        tool: { type: string }
        is_error:
          type: boolean
          description: |
            A tool that returned an error is still a successful inspection —
            the operator asked what happens, and this is what happens. The HTTP
            status stays 200.
        needs_input:
          type: boolean
          description: |
            An MRTR deferral. The call did not fail; it is waiting for a human.
        duration_ms: { type: integer, format: int64 }
        text: { type: string }
        gateway_detail:
          description: |
            The gateway's own `_meta` annotation — which plugin mutated the
            result, which hook denied it. Shaped by the pipeline rather than by
            this API, so it is returned as-is.
        input_requests:
          type: array
          items: { type: string }
        request_state:
          type: string
          description: |
            The signed envelope to send back with the answers. Unforgeable, not
            secret: a client can decode it and see what it binds.
