# MCPDoll local development registry.
#
# This is the reviewable source a snapshot is built from: `mcpdoll snapshot build`
# discovers each backend below, canonicalizes what it publishes, and resolves the
# toolsets into a signed artifact.
#
# Two tenants, deliberately. `acme` gets everything; `globex` gets one backend at
# a different address. That is the shape ADR 0017 exists for — the same logical
# backend is a different deployment per tenant, so the same toolset name resolves
# to different data depending on whose key is presented.
#
# There are no audiences here and no allowed_idp_groups. Who sees what is decided
# by grants in the database, not by this document (ADR 0016): a toolset is the
# unit an admin grants, and the tenant comes from the credential.
#
# `version` is this document's revision, bumped in the change that edits it. It
# is not the snapshot version — that is assigned at build time, because a
# grants-only republish edits no file here and still has to produce a snapshot
# the data plane will accept.
org: org_local
version: 1

catalog:
  ttl: 5m
  degraded_ttl: 30s

namespaces:
  - id: ns_crm
    name: crm
    prefix: crm
    owner_idp_group: eng-crm
    team: team_revenue
    project: prj_go_to_market

  - id: ns_hr
    name: hr
    prefix: hr
    owner_idp_group: eng-people
    team: team_people
    project: prj_internal

  - id: ns_warehouse
    name: warehouse
    prefix: whs
    owner_idp_group: eng-logistics
    team: team_ops
    project: prj_supply_chain

  - id: ns_deploy
    name: deploy
    prefix: dep
    owner_idp_group: eng-platform
    team: team_platform
    project: prj_internal

  # The hostile backend is registered but sits in its own toolset, so it reaches
  # only a principal granted that toolset by name. It exists so `make dev` has
  # something to demonstrate admission review and the LLM guard against.
  - id: ns_websearch
    name: websearch
    prefix: web
    owner_idp_group: eng-platform
    team: team_platform
    project: prj_internal

servers:
  - id: srv_crm
    name: crm-prod
    namespace: ns_crm
    # The point of per-tenant bindings, made concrete: two tenants, two
    # deployments of the same backend, discovered and admitted separately.
    # Acme's CRM and Globex's CRM will eventually publish different tool
    # versions, and each tenant's catalog has to follow its own.
    bindings:
      - tenant: acme
        primary: http://localhost:9101
      - tenant: globex
        primary: http://localhost:9106
    serving_mode: strict
    criticality: high
    data_classification: confidential
    default_effect_class: read
    canary_tool: lookup_customer
    tools:
      update_customer:
        effect_class: write

  - id: srv_hr
    name: hr-legacy
    namespace: ns_hr
    bindings:
      - tenant: acme
        primary: http://localhost:9102
    serving_mode: strict
    criticality: normal
    data_classification: confidential
    # This backend speaks only 2025-11-25; the gateway negotiates down per
    # backend while still serving 2026-07-28 to its own clients.
    default_effect_class: read

  - id: srv_warehouse
    name: warehouse-flaky
    namespace: ns_warehouse
    bindings:
      - tenant: acme
        primary: http://localhost:9103
    # Advisory rather than strict: this backend is still stabilising its catalog,
    # so divergence is recorded instead of quarantining it. Clients still only
    # ever see admitted definitions.
    serving_mode: advisory
    criticality: normal
    data_classification: internal
    default_effect_class: read
    canary_tool: check_stock
    tools:
      reserve_stock:
        effect_class: write

  - id: srv_deploy
    name: deploy-confirming
    namespace: ns_deploy
    bindings:
      - tenant: acme
        primary: http://localhost:9105
    serving_mode: strict
    criticality: critical
    data_classification: internal
    compliance_scope: [sox]
    # Everything this backend does is destructive, so the default is the strict
    # one and no tool can be quietly reclassified by omission.
    default_effect_class: destructive

  - id: srv_websearch
    name: websearch-hostile
    namespace: ns_websearch
    bindings:
      - tenant: acme
        primary: http://localhost:9104
    serving_mode: strict
    criticality: low
    data_classification: public
    default_effect_class: read

toolsets:
  # A toolset is what an admin grants. Its name appears verbatim in every scope
  # string — `t/acme/ts/support` — so renaming one silently changes who can
  # reach it, which is why the name lives here rather than being a display
  # label.
  - id: ts_support
    name: support
    priority: 10
    ttl: 5m
    token_budget: 20000
    namespaces: [ns_crm, ns_hr, ns_warehouse]

  # Platform operators additionally get the deployment tools.
  - id: ts_platform
    name: platform
    priority: 20
    token_budget: 20000
    namespaces: [ns_deploy]

  # The hostile backend, isolated in its own toolset so it reaches only a
  # principal granted `t/<tenant>/ts/untrusted` by name.
  - id: ts_untrusted
    name: untrusted
    priority: 90
    token_budget: 20000
    namespaces: [ns_websearch]

policies:
  - id: pol_destructive_confirm
    name: confirm-destructive
    priority: 10
    rules:
      # Destructive tools require human confirmation, whoever is asking. The
      # gateway turns this into an MRTR input_required round trip.
      - effect_classes: [destructive]
        decision: confirm
        reason: destructive operations require explicit human confirmation

  - id: pol_restricted_data
    name: restricted-data
    priority: 20
    rules:
      # A tool over restricted data is hidden from anyone outside the group that
      # owns it. Group-conditioned hiding makes the catalog identity-specific,
      # which the builder records — though every catalog is private now anyway,
      # because every catalog is derived from one principal's grants.
      - data_classifications: [restricted]
        required_idp_groups: [data-restricted]
        decision: hide
        reason: restricted-classification tools are visible only to authorized groups
        identity_specific: true

plugins:
  # The `artifact_digest` values below are stamped by deploy/dev-up.sh when it
  # builds the plugins, because a digest cannot be a constant in a committed file
  # — it changes whenever a plugin does. Run `make dev` rather than building a
  # snapshot by hand, or the digests here will not match your build and the host
  # will (correctly) refuse to load the plugin.

  # Redaction runs at ON_TOOL_RESULT, where content nobody reviewed arrives.
  # Enforcing from the start because it only ever removes; a redaction plugin in
  # shadow protects nothing.
  - id: plg_redact
    name: redact
    version: 1.0.0
    runtime: wasm
    hooks: [on_tool_result]
    priority: 50
    budget: 50ms
    reads: [result]
    writes: [result.content]
    rollout: enforce
    artifact_ref: file://deploy/local/plugins/redact.wasm
    artifact_digest: "sha256:77c25b4766055af752a3a9471170deeb3a3221f4a740f33923226a8fed78d3c1"
    failure_policy:
      # A redaction outage on a read should not take down every read; on a
      # destructive call, proceeding without the check is not a safe default.
      read: open
      write: open
      destructive: closed
    config:
      builtins: true
      placeholder: "[REDACTED]"
      annotate: true

  # Entitlements starts in SHADOW: its verdicts are recorded and not acted on,
  # so an operator can read the shadow diff before it starts denying anything.
  - id: plg_entitlements
    name: entitlements
    version: 1.0.0
    runtime: wasm
    hooks: [on_catalog, on_tool_call]
    priority: 20
    budget: 50ms
    reads: [principal, catalog, tool]
    writes: [catalog]
    identity_dependent: true
    rollout: shadow
    artifact_ref: file://deploy/local/plugins/entitlements.wasm
    artifact_digest: "sha256:64028822682f96733bb3954be8022dbaa2f9afcd29506fa2eea3b58e455e18cf"
    failure_policy:
      read: open
      destructive: closed
    config:
      default: allow
      hide_denied: true
      rules:
        # Warehouse tools are for the logistics team. In SHADOW this only
        # records what it *would* hide — read the divergences before promoting.
        - match: "whs.*"
          allow_groups: [eng-logistics]
        - match: "dep.*"
          allow_groups: [eng-platform]
