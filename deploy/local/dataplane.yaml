# Data-plane configuration for `make dev`.
#
# Trusted signing keys are injected by deploy/dev-up.sh after it generates the
# local keypair, so this file has no secrets and is safe to commit.
env: development

log:
  level: info
  format: text

telemetry:
  otlp_endpoint: http://localhost:4318
  service_name: mcpdoll-dp
  sample_ratio: 1.0

dataplane:
  listen_addr: ":8080"
  admin_addr: ":8081"
  # File source rather than the gRPC stream: the control plane's distribution
  # server is not built yet (see docs/deferred.md), and a signed file is exactly
  # as trustworthy because the signature is verified either way.
  snapshot_source: file
  snapshot_path: deploy/local/snapshot.pb
  revocations_path: deploy/local/revocations.pb
  snapshot_history: 5

controlplane:
  listen_addr: ":3001"
  registry_path: deploy/local/registry.yaml
  gateway_url: http://localhost:8080
  admin_url: http://localhost:8081
  signing_key_path: deploy/local/dev.key
  signing_key_id: dev
  key_dir: deploy/local
  revocations_path: deploy/local/revocations.pb
  # The console's dev server. Named explicitly — this API mints signing keys,
  # so no wildcard origin is acceptable even locally.
  allowed_origins:
    - http://localhost:5173

pipeline:
  total_budget: 250ms
  hook_budget: 50ms
  circuit_failure_threshold: 3
  circuit_cooldown: 10s

health:
  probe_interval: 30s
  probe_timeout: 5s
  grace_window: 10m
  eject_after_failures: 3
  ewma_alpha: 0.2
  drift_scan_interval: 1m
