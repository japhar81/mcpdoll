# The whole MCPDoll stack in containers.
#
# Startup has a real ordering constraint and compose enforces it rather than
# leaving it to a sleep: the fixtures must be answering before the snapshot can
# be built from what they publish, and the snapshot must exist before the data
# plane starts. `bootstrap` is a one-shot container between the two, and
# everything after it waits on `service_completed_successfully`.
#
# Postgres holds the control plane's durable state — tenants, users, grants,
# and credentials (ADR 0014). The data plane never connects to it: grants reach
# it inside a signed snapshot, which is what keeps a database outage from
# stopping a tool call.
#
# Redis is still absent: nothing in this build talks to it.

name: mcpdoll

# Every Go service runs the same image. Only ONE service declares how to build
# it — `bootstrap`, below. Declaring the same build on several services makes
# buildx run them concurrently and race on the export ("image already exists"),
# and the failure looks like a Docker bug rather than a compose mistake.
#
# So: build through `make docker-up`, which builds before it starts. A bare
# `docker compose up` on a machine with no image fails on the fixtures with a
# legible "image not found".
x-mcpdoll-image: &mcpdoll-image
  image: mcpdoll/mcpdoll:dev
  pull_policy: never

# Every fixture is the same image and the same shape; only the kind and the port
# differ. Anchored so adding one is two lines rather than twelve.
x-fixture: &fixture
  <<: *mcpdoll-image
  restart: unless-stopped
  networks: [mcpdoll]

services:
  # ------------------------------------------------------ observability ----

  # Grafana's all-in-one LGTM bundle: Grafana, Prometheus, Loki, Tempo, and an
  # OpenTelemetry Collector in one container. Same image and conventions as
  # RAGdoll (ADR 0001), so both products' telemetry can share a Grafana.
  otel-collector:
    image: grafana/otel-lgtm:0.11.10
    container_name: mcpdoll-lgtm
    restart: unless-stopped
    networks: [mcpdoll]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous viewer access: bringing the stack up should not ask a
      # developer to log in to read their own traces.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      ENABLE_LOGS_GRAFANA: "true"
      ENABLE_LOGS_OTELCOL: "true"
    ports:
      - "3300:3000"   # Grafana  -> http://localhost:3300
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - lgtm-data:/data
      # Single FILE mounts, never a directory mount over
      # /otel-lgtm/grafana/conf/provisioning. That directory is where the image
      # keeps its own Prometheus, Tempo, Loki and Pyroscope datasources, and a
      # directory mount replaces it wholesale — which is exactly how this stack
      # came to have a Grafana with no datasources and no metrics in it.
      - ./observability/mcpdoll-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/mcpdoll.yaml:ro
      - ./observability/dashboards:/var/lib/grafana/mcpdoll-dashboards:ro
    healthcheck:
      # The image ships neither curl nor wget, so probe with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3000' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------- postgres ----

  postgres:
    image: postgres:17-alpine
    container_name: mcpdoll-postgres
    restart: unless-stopped
    networks: [mcpdoll]
    environment:
      POSTGRES_USER: mcpdoll
      POSTGRES_PASSWORD: mcpdoll
      POSTGRES_DB: mcpdoll
    ports:
      # Published so `go test -tags=integration ./...` and psql can reach it
      # from the host. A deployment would not publish this.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory. Creates the test database so the
      # suite never writes into the stack's own.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -U and -d, because pg_isready defaults to the OS user and would report
      # ready against a database that does not exist.
      test: ["CMD-SHELL", "pg_isready -U mcpdoll -d mcpdoll"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ----------------------------------------------------------- fixtures ----
  # Five real MCP backends. Not mocks of a backend — real servers built on the
  # official SDK, which is why a protocol disagreement shows up here rather than
  # in production.

  fixture-crm:
    <<: *fixture
    container_name: mcpdoll-fixture-crm
    command: ["fixture-backend", "-kind", "modern", "-addr", ":9101"]
    healthcheck: &fixture-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9101/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  fixture-crm-globex:
    <<: *fixture
    container_name: mcpdoll-fixture-crm-globex
    # The same backend, a second tenant's deployment. Two containers rather than
    # one shared: a binding that pointed both tenants at the same host would
    # render correctly in the console and demonstrate nothing, because the whole
    # claim of ADR 0017 is that the data behind a toolset differs per tenant.
    command: ["fixture-backend", "-kind", "modern", "-addr", ":9106"]
    healthcheck:
      <<: *fixture-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9106/healthz"]

  fixture-hr:
    <<: *fixture
    container_name: mcpdoll-fixture-hr
    # Legacy by construction: it speaks only 2025-11-25, so the gateway has to
    # negotiate down per backend while still serving 2026-07-28 to its clients.
    command: ["fixture-backend", "-kind", "legacy", "-addr", ":9102"]
    healthcheck:
      <<: *fixture-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9102/healthz"]

  fixture-warehouse:
    <<: *fixture
    container_name: mcpdoll-fixture-warehouse
    # Deliberately slow, and fails one call in seven, so the health board and
    # the circuit breaker have something real to show.
    command:
      - fixture-backend
      - -kind=misbehaving
      - -addr=:9103
      - -latency=120ms
      - -fail-every=7
    healthcheck:
      <<: *fixture-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9103/healthz"]

  fixture-websearch:
    <<: *fixture
    container_name: mcpdoll-fixture-websearch
    # Poisoned descriptions and injected results. Registered, but in its own
    # toolset, so it reaches only a principal granted `ts/untrusted` by name.
    command: ["fixture-backend", "-kind", "hostile", "-addr", ":9104"]
    healthcheck:
      <<: *fixture-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9104/healthz"]

  fixture-deploy:
    <<: *fixture
    container_name: mcpdoll-fixture-deploy
    # Real MRTR: its tools ask for confirmation before acting.
    command: ["fixture-backend", "-kind", "confirming", "-addr", ":9105"]
    healthcheck:
      <<: *fixture-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9105/healthz"]

  # ---------------------------------------------------------- bootstrap ----

  bootstrap:
    <<: *mcpdoll-image
    # The one place the shared image is built. It is the right one: every
    # serving container depends on this having completed, so an image rebuild
    # cannot be skipped by anything that matters.
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: mcpdoll-bootstrap
    command: ["bootstrap.sh"]
    # Runs to completion and exits. Everything that serves waits on that exit
    # code, so a failed bootstrap stops the stack instead of producing a data
    # plane that 503s for a reason nobody can see.
    restart: "no"
    networks: [mcpdoll]
    volumes:
      - state:/srv/state
    # No fixture dependency: this half generates a key and resolves a registry,
    # and neither touches a backend. Discovery happens in the snapshot build,
    # which is `seed`'s job.

  # --------------------------------------------------------- data plane ----

  dataplane:
    <<: *mcpdoll-image
    container_name: mcpdoll-dp
    command: ["entrypoint-dp.sh"]
    restart: unless-stopped
    networks: [mcpdoll]
    environment:
      # The MRTR envelope key. A fixed development value: it must be stable
      # across restarts, or a confirmation issued before a restart would be
      # refused after one. A real deployment takes it from a secret store.
      MCPDOLL_REQUEST_STATE_KEY: local-dev-request-state-key-32-bytes!!
    ports:
      - "8080:8080"   # the MCP endpoint: one /mcp, tenant from the key
      - "8081:8081"   # admin: backend health
    volumes:
      - state:/srv/state:ro
    depends_on:
      # `seed`, not `bootstrap`: the snapshot cannot exist until the database
      # has tenants to put in it, so it is built at the end of seeding.
      seed: { condition: service_completed_successfully }
    healthcheck:
      # readyz, not healthz: a data plane with no snapshot is alive and cannot
      # serve, and starting the control plane against it would only produce
      # confusing 502s.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ------------------------------------------------------ control plane ----

  controlplane:
    <<: *mcpdoll-image
    container_name: mcpdoll-cp
    command: ["mcpdoll-cp", "-config", "/srv/src/dataplane.yaml"]
    restart: unless-stopped
    networks: [mcpdoll]
    environment:
      # A fixed development token rather than --allow-anonymous. Anonymous mode
      # exists and works, but running the stack the way production runs means
      # the console exercises the auth path daily rather than discovering it at
      # deploy time.
      MCPDOLL_CP_TOKEN: ${MCPDOLL_CP_TOKEN:-dev-token-not-a-secret}
      MCPDOLL_DATABASE_URL: postgres://mcpdoll:mcpdoll@postgres:5432/mcpdoll?sslmode=disable
    ports:
      - "3001:3001"
    volumes:
      # Writable: buildSnapshot and generateSigningKey write here.
      - state:/srv/state
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      # Deliberately NOT the data plane. The control plane creates the tenants
      # the first snapshot carries, and the data plane cannot start until that
      # snapshot exists — waiting on it here would be a cycle. A control plane
      # whose gateway is unreachable reports that as a state rather than
      # failing, which is the same thing it has to do in production anyway.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # --------------------------------------------------------------- seed ----

  seed:
    <<: *mcpdoll-image
    container_name: mcpdoll-seed
    command: ["seed.sh"]
    # Through the API, not the database. The same path an operator uses, so a
    # broken command fails here rather than the first time somebody types it.
    restart: "no"
    networks: [mcpdoll]
    environment:
      MCPDOLL_CP_TOKEN: ${MCPDOLL_CP_TOKEN:-dev-token-not-a-secret}
      MCPDOLL_API_URL: http://controlplane:3001
      MCPDOLL_DATABASE_URL: postgres://mcpdoll:mcpdoll@postgres:5432/mcpdoll?sslmode=disable
    volumes:
      - state:/srv/state
    depends_on:
      controlplane: { condition: service_healthy }
      # The snapshot build discovers every backend, so they have to be up.
      fixture-crm: { condition: service_healthy }
      fixture-crm-globex: { condition: service_healthy }
      fixture-hr: { condition: service_healthy }
      fixture-warehouse: { condition: service_healthy }
      fixture-websearch: { condition: service_healthy }
      fixture-deploy: { condition: service_healthy }

  # ------------------------------------------------------------ console ----

  console:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.console
    image: mcpdoll/console:dev
    container_name: mcpdoll-console
    restart: unless-stopped
    networks: [mcpdoll]
    environment:
      MCPDOLL_API_URL: http://controlplane:3001
    ports:
      - "5173:5173"
    volumes:
      # Source mounted read-only so an edit is live on refresh. node_modules is
      # masked by an anonymous volume: the host's copy is built for the host's
      # platform, and letting it shadow the image's would break the moment they
      # differ.
      - ../web/src:/app/src:ro
      - ../web/index.html:/app/index.html:ro
      - /app/node_modules
    depends_on:
      controlplane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  mcpdoll:
    name: mcpdoll

volumes:
  lgtm-data:
  pgdata:
  # The signing key, the resolved registry, and the snapshot. Shared between the
  # bootstrap that writes them and the planes that read them.
  state:
